# prometheus.yml - scrape and evaluate for a single-host deployment.
#
# The backend exposes /metrics on the same port as the API. There is no exporter and no
# sidecar: one process, one scrape target, one rules file.
#
#   docker compose -f deploy/docker-compose.prod.yml --profile observability up -d prometheus
#   curl -s http://127.0.0.1:9090/api/v1/rules | jq '.data.groups[].rules[].name'
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: hape

rule_files:
  - /etc/prometheus/hape.rules.yml

# Rules without an Alertmanager target fire into nothing: they show up in the Prometheus UI
# and never reach a person. The service below only exists under the `observability` profile,
# so in a deployment that runs Prometheus alone these sends fail harmlessly - which is the
# honest state, and visible in Prometheus' own alerting page.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hape-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: platform