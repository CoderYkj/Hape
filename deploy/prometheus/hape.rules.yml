# hape.rules.yml - alerting rules for the backend.
#
# One rule, because there is one failure that costs money quietly: a dedicated server the
# provider never confirmed stopped. Everything else the backend does is either visible as
# a 5xx in the request metrics or does not have a bill attached.
#
# Wire it up:
#   rule_files:
#     - /etc/prometheus/hape.rules.yml
#   scrape_configs:
#     - job_name: hape
#       static_configs:
#         - targets: ["127.0.0.1:8080"]   # same port as the API; /metrics is open
groups:
  - name: hape.battle
    rules:
      # spec 0015: Release = stop request + read-back. A session in release_pending has
      # had its stop accepted (possibly several times) while the provider still reports
      # the instance as running - a recurring charge, not a cosmetic warning.
      - alert: DedicatedServerReleaseStuck
        expr: backend_release_pending_sessions > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} dedicated server(s) could not be confirmed released"
          description: >-
            The provider accepted the stop request but never stopped reporting the
            instance as running. Check backend_release_max_attempts for how many retries
            have failed, and the backend log for "release retry failed" lines naming the
            allocation id.
          runbook: "docs/deploy.md#118-回收回读的指标与告警"