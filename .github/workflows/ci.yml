# CI for the backend. This file assumes the repository root IS the backend
# directory (the layout of this repo). If the backend is ever nested inside a
# larger repo, move this file to that repo's .github/workflows and add
# `defaults: run: working-directory: <backend-dir>`.
#
# Mirrors `scripts/verify.sh` step by step, and adds what a developer machine
# cannot do: the race detector (needs cgo) and the PostgreSQL-backed tests
# (need a database). Both are run here, for real, on every push.
#
#   first run: https://github.com/CoderYkj/Hape/actions/runs/41191405286 (success)

name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # The equivalence suites (services/*/store_equiv_test.go) skip without a
      # database; the point of this service is that they do not skip here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamebackend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gamebackend?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # There is exactly one third-party dependency (pgx, ADR 0006), so the
          # module cache is worth keeping between runs.
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files that need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: migrate
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: schema probes
        run: |
          for f in db/probes/*.probe.sql; do
            echo "probing $f"
            psql "$DATABASE_URL" -t -q -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: go test (race, with database)
        env:
          BACKEND_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gamebackend?sslmode=disable
        run: go test -race -v ./... | tee /tmp/go-test.log

      # A green run is not proof that the database tests executed: they skip when
      # BACKEND_TEST_DATABASE_URL is unset, and a skip looks like a pass. This
      # turns "they were supposed to run" into an enforced fact.
      - name: assert the database suites did not skip
        run: |
          if grep -E 'SKIP: (TestStoresAgree|TestSettlementIsAtomic|TestPGReports)' /tmp/go-test.log; then
            echo "database-backed tests were skipped in CI; check BACKEND_TEST_DATABASE_URL"
            exit 1
          fi
          grep -c 'PASS: TestStoresAgree' /tmp/go-test.log

      - name: contract drift
        run: |
          go run ./tools/apigen -check || {
            echo "OpenAPI is stale. Run: go run ./tools/apigen"
            exit 1
          }

  # The Dockerfile and the compose stack are not runnable on a developer machine
  # without Docker, so they are exercised here instead: build the image, run it,
  # probe it; then bring up compose with a real database, apply the migrations and
  # prove a request actually lands a row in PostgreSQL.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t hape:ci .

      - name: run and probe
        run: |
          docker run -d --rm --name hape-ci -p 8080:8080 hape:ci
          ok=no
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=yes; break; fi
            sleep 1
          done
          if [ "$ok" != yes ]; then
            echo "backend never became healthy"
            docker logs hape-ci
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/metrics | head -5
          # The image must run as a non-root user (Dockerfile claim, checked here).
          test "$(docker exec hape-ci id -u)" = "10001"
          docker stop hape-ci

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: up postgres + backend
        run: docker compose -f deploy/docker-compose.yml up -d --build postgres backend

      - name: wait for the backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose -f deploy/docker-compose.yml logs backend
          exit 1

      - name: apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U gamebackend -d gamebackend -v ON_ERROR_STOP=1 < "$f"
          done

      - name: schema probes
        run: |
          for f in db/probes/*.probe.sql; do
            echo "probing $f"
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U gamebackend -d gamebackend -t -q -v ON_ERROR_STOP=1 < "$f"
          done

      - name: a request must land in the database
        run: |
          # Login is service-only (ADR 0010), so this call carries the service token.
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer dev-service' \
            -d '{"external_id":"ci-smoke"}' \
            http://127.0.0.1:8080/v1/account/sessions
          count="$(docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U gamebackend -d gamebackend -tAc \
            "select count(*) from players where external_id = 'ci-smoke'")"
          echo "players with external_id=ci-smoke: $count"
          test "$count" = "1"

      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  # The Nakama plugin is a separate Go module with a separate toolchain requirement,
  # and it is the one piece of the login path that had never been compiled. A plain
  # `go build` cannot check it (a plugin has package main but no func main), so the
  # only honest check is a plugin build - which needs Linux.
  nakama-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: nakama/modules/go.mod
          cache-dependency-path: nakama/modules/go.sum

      - name: vet (type-check without linking)
        working-directory: nakama/modules
        run: go vet ./...

      - name: build the plugin
        working-directory: nakama/modules
        run: |
          go build -buildmode=plugin -o /tmp/gamemodule.so .
          test -s /tmp/gamemodule.so
          ls -l /tmp/gamemodule.so

  # The last unproven piece of the login path: a real Nakama instance loading the Go
  # plugin and calling the backend. Needs Docker (for Nakama) and therefore cannot be
  # run on the development machine - which is exactly why it lives here.
  # The one thing that cannot be checked locally: a real Nakama loads the bridge and
  # calls the backend. Docker is only available here, so this job is the proof.
  nakama:
    runs-on: ubuntu-latest
    env:
      # The module reaches the backend by compose service name, not localhost.
      BACKEND_BASE_URL: http://backend:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build postgres backend nakama

      - name: wait for the backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          exit 1

      - name: apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U gamebackend -d gamebackend -v ON_ERROR_STOP=1 < "$f"
          done

      - name: wait for Nakama to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7350/healthcheck >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "nakama did not answer /healthcheck; see the diagnostics below"
          exit 1

      # Nakama stays healthy even when a runtime module fails to register, so assert
      # the module's own log line instead of trusting the health endpoint.
      - name: runtime module loaded
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml logs --no-color nakama > /tmp/nakama.log || true
          if grep -q "gamemodule loaded" /tmp/nakama.log; then
            grep "gamemodule loaded" /tmp/nakama.log
            exit 0
          fi
          echo "::error title=runtime module missing::the Lua module did not register rpc=login"
          grep -iE "error|fatal|lua|module" /tmp/nakama.log | tail -30 || true
          exit 1

      - name: login through the module
        run: |
          set -o pipefail
          go run ./tools/nakama-smoke 2>&1 | tee /tmp/nakama-smoke.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error title=nakama smoke::$(grep -iE 'nakama-smoke:|rpc login|error' /tmp/nakama-smoke.log | head -3 | tr '\n' ' ' | cut -c1-400)"
            docker compose -f deploy/docker-compose.yml logs --no-color nakama | tail -40 || true
          fi
          exit $status

      # The smoke probe's own output is the diagnosis; put it where it can be read.
      - name: smoke diagnostics
        if: always()
        run: |
          echo "=== smoke output ==="
          cat /tmp/nakama-smoke.log 2>/dev/null || echo "no smoke output"
          echo "=== module-side errors ==="
          docker compose -f deploy/docker-compose.yml logs --no-color nakama 2>/dev/null | grep -i "login:" | tail -10 || true
          echo "=== backend login lines ==="
          docker compose -f deploy/docker-compose.yml logs --no-color backend 2>/dev/null | grep -i "account/sessions" | tail -5 || true
          # Only shout when the probe actually failed: a green run should not carry
          # error-level annotations just because the diagnostics step ran.
          if grep -q "^OK:" /tmp/nakama-smoke.log 2>/dev/null; then
            echo "smoke probe succeeded"
            exit 0
          fi
          msg="$(grep -iE "nakama-smoke:|rpc login|no player|error" /tmp/nakama-smoke.log 2>/dev/null | head -3 | tr '\n' ' ' | cut -c1-400)"
          echo "::error title=smoke failure::${msg:-no detail captured}"
          mod="$(docker compose -f deploy/docker-compose.yml logs --no-color nakama 2>/dev/null | grep -i "login:" | tail -2 | tr '\n' ' ' | cut -c1-400)"
          echo "::error title=module failure::${mod:-no module error logged}"

      # The client half, in the smallest verifiable form: login -> exchange -> profile
      # -> enqueue -> poll. Same protocol a UE5 client must speak.
      - name: the client half (login, exchange, profile, enqueue, poll)
        run: |
          go run ./clients/minimal 2>&1 | tee /tmp/client.log
          grep -q '^CLIENT_OK=1$' /tmp/client.log

      - name: build the dedicated server image
        run: docker build -f Dockerfile.ds -t hape-ds:ci .

      # The client loop closed: a Nakama identity, a real match out of the queue, a
      # containerized dedicated server, packets both ways, and the payout read back with
      # the client's own token. Every earlier step mocks one of these pieces.
      - name: the client plays a full match against a dedicated server
        run: IDENTITY=nakama QUEUE=ue5-drill sh scripts/ds-match-drill.sh

      - name: the account is really in the backend database
        run: |
          external_id="$(grep '^EXTERNAL_ID=' /tmp/nakama-smoke.log | cut -d= -f2)"
          test -n "$external_id"
          count="$(docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U gamebackend -d gamebackend -tAc \
            "select count(*) from players where external_id = '$external_id'")"
          echo "players with external_id=$external_id: $count"
          test "$count" = "1"

      - name: logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps -a
          docker compose -f deploy/docker-compose.yml logs --no-color backend | tail -40
          docker compose -f deploy/docker-compose.yml logs --no-color nakama | tail -80

      - name: tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  # Operations, not code: the deploy step is a script and a compose file, so it is
  # exercised the same way. Everything here runs against a throwaway database.
  ops:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamebackend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gamebackend?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: apply migrations
        run: sh scripts/db-migrate.sh

      - name: a second run is a no-op
        run: |
          out="$(sh scripts/db-migrate.sh)"
          echo "$out"
          echo "$out" | grep -q '0 applied'

      # The append-only rule is a claim until something tries to break it.
      - name: editing an applied migration is refused
        run: |
          mkdir -p /tmp/migs
          cp db/migrations/*.sql /tmp/migs/
          printf '\n-- tampered\n' >> /tmp/migs/0001_init.sql
          if MIGRATIONS_DIR=/tmp/migs sh scripts/db-migrate.sh; then
            echo "::error title=append-only guard::an edited migration was accepted"
            exit 1
          fi
          MIGRATIONS_DIR=/tmp/migs sh scripts/db-migrate.sh 2>&1 | grep -q 'append-only'

      - name: a backup survives losing the data
        run: |
          psql -v ON_ERROR_STOP=1 -c \
            "INSERT INTO players (id, external_id, display_name) VALUES ('p_backup','ext-backup','Backup')" \
            "$DATABASE_URL"
          # The dump has to come from a client matching the server: pg_dump 17 writes
          # SET transaction_timeout, which server 16 rejects. Running the scripts inside
          # the same image pins the pair instead of inheriting the runner's client.
          docker run --rm --network host -e DATABASE_URL \
            -v "$PWD:/w" -v /tmp:/tmp -w /w --entrypoint sh postgres:16 \
            scripts/db-backup.sh /tmp/ops.dump
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM players WHERE id = 'p_backup'" "$DATABASE_URL"
          count="$(psql -tAc "SELECT count(*) FROM players" "$DATABASE_URL")"
          echo "rows after deletion: $count"

      # A drill restores into a *fresh* database, not over the live one: pg_restore
      # --clean cannot drop tables in an order that satisfies foreign keys, and
      # overwriting production in place is not a recovery plan anyway.
      - name: restoring brings the data back
        run: |
          set -o pipefail
          base="${DATABASE_URL%/*}"
          psql -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS gamebackend_restore" "${base}/postgres"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE gamebackend_restore" "${base}/postgres"
          if ! RESTORE_CONFIRM=yes DATABASE_URL="${base}/gamebackend_restore?sslmode=disable" \
               docker run --rm --network host -e RESTORE_CONFIRM -e DATABASE_URL \
                 -v "$PWD:/w" -v /tmp:/tmp -w /w --entrypoint sh postgres:16 \
                 scripts/db-restore.sh /tmp/ops.dump 2>&1 | tee /tmp/restore.log; then
            echo "::error title=restore failed::$(tail -3 /tmp/restore.log | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          count="$(psql -tAc "SELECT count(*) FROM players WHERE id = 'p_backup'" \
            "${base}/gamebackend_restore?sslmode=disable")"
          echo "marker rows in the restored copy: $count"
          test "$count" = "1"

      - name: restoring without confirmation is refused
        run: |
          if sh scripts/db-restore.sh /tmp/ops.dump; then
            echo "::error title=restore guard::a restore ran without RESTORE_CONFIRM=yes"
            exit 1
          fi

      # A production compose file that starts with missing secrets is worse than one
      # that refuses to parse, so the `${VAR:?}` guards are asserted too.
      - name: the production compose file refuses to start without secrets
        run: |
          if docker compose -f deploy/docker-compose.prod.yml config -q >/dev/null 2>&1; then
            echo "::error title=prod compose::started without required secrets"
            exit 1
          fi
          echo "missing secrets are rejected"

      - name: the production compose file validates with the example env
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/systemd/backend.env.example config -q

      - name: the systemd unit is syntactically valid
        run: systemd-analyze verify deploy/systemd/gamebackend.service

      # Alerting rules are code: a rule that does not parse, or that names a metric nobody
      # exports, looks like coverage and is the opposite. promtool catches the first half,
      # the drift test in platform/ catches the second.
      - name: the alerting rules are valid PromQL
        run: |
          # The image's entrypoint is /bin/prometheus, so promtool has to be requested
          # explicitly; without --entrypoint "promtool" becomes an argument to prometheus.
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.53.0 \
            check rules /etc/prometheus/hape.rules.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml

  # The dedicated server image, and the runtime contract it implements. This is the
  # only place the per-session credential is proven to arrive *inside an instance*:
  # the backend mints it, the provider passes it as container environment, and the
  # server reports back using it. spec 0012.
  ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build the dedicated server image
        run: docker build -f Dockerfile.ds -t hape-ds:ci .

      - name: the image runs unprivileged
        run: test "$(docker run --rm --entrypoint id hape-ds:ci -u)" = "10001"

      # A container that starts without the per-session token would happily serve a
      # match it cannot report: players play, nothing settles, and the failure is
      # silent. It must refuse to start instead, and say which variable is missing.
      - name: an instance without the runtime token refuses to start
        run: |
          set +e
          output="$(docker run --rm --network host \
            -e BACKEND_BASE_URL=http://127.0.0.1:8080 \
            -e BACKEND_SERVICE_TOKEN=dev-service \
            -e BATTLE_SESSION_ID=s_ci \
            -e PLAYERS='["p_1","p_2"]' \
            hape-ds:ci 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error title=ds runtime contract::started without RUNTIME_TOKEN"
            exit 1
          fi
          echo "$output" | grep -q 'RUNTIME_TOKEN'

      - name: start the backend
        run: |
          go build -o /tmp/platform ./cmd/platform
          nohup env BACKEND_ADDR=127.0.0.1:8080 /tmp/platform > /tmp/platform.log 2>&1 &
          ok=no
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=yes; break; fi
            sleep 1
          done
          if [ "$ok" != yes ]; then
            echo "::error title=ds job::the backend never became healthy"
            tail -50 /tmp/platform.log
            exit 1
          fi

      - name: a containerized dedicated server settles a match
        run: go run ./tools/fakeds -launch-ds docker -ds-image hape-ds:ci

      - name: the same match with the server as a plain process
        run: go run ./tools/fakeds -launch-ds exec

      - name: a crashed instance restarts and still settles once
        run: go run ./tools/fakeds -launch-ds docker -ds-image hape-ds:ci -crash-restart

      - name: the client plays a full match (dev identity, no Nakama needed)
        run: IDENTITY=dev QUEUE=ue5-drill sh scripts/ds-match-drill.sh

      - name: backend log
        if: always()
        run: tail -60 /tmp/platform.log

  # Publishing the artifact. What runs in production has to be the thing CI built and
  # pushed, so the tag is the commit sha and the job pulls it back to prove it is
  # servable.
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: build the image
        run: docker build -t hape:release .

      - name: push to the registry with the commit sha as the tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA:0:12}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || {
            echo "::error title=registry login::ghcr.io rejected GITHUB_TOKEN (repository may need packages write permission)"
            exit 1
          }
          docker tag hape:release "$image"
          docker push "$image" || {
            echo "::error title=registry push::could not push $image (check workflow permissions: packages write)"
            exit 1
          }

      - name: the pushed image actually runs
        run: |
          docker pull "$IMAGE"
          docker run -d --rm --name hape-release -p 8080:8080 "$IMAGE"
          ok=no
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=yes; break; fi
            sleep 1
          done
          docker stop hape-release
          if [ "$ok" != yes ]; then
            echo "::error title=released image::the published artifact never became healthy"
            exit 1
          fi
          echo "::notice title=released image::$IMAGE"

      # The dedicated server ships from the same commit as the backend it reports to,
      # under a `-ds` suffix: one repository, two runtimes, no version skew by accident.
      - name: build and push the dedicated server image
        run: |
          ds_image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA:0:12}-ds"
          docker build -f Dockerfile.ds -t "$ds_image" .
          docker push "$ds_image" || {
            echo "::error title=registry push::could not push $ds_image"
            exit 1
          }
          echo "::notice title=released dedicated server::$ds_image"